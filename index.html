<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A quiet space for daily remembrance. Your Adkar, available offline in English, Malayalam, Hindi and Arabic."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>Adkar · Daily remembrance</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('adkar-state') || '{}');
        const theme = ['light', 'dark'].includes(saved.theme) ? saved.theme : 'system';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.textSize = ['standard', 'large', 'extra-large'].includes(
          saved.interfaceSize,
        )
          ? saved.interfaceSize
          : 'large';
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101714' : '#f5f5f0';
        if (['en', 'ml', 'hi', 'ar'].includes(saved.lang))
          document.documentElement.lang = saved.lang;
        document.documentElement.dir = saved.lang === 'ar' ? 'rtl' : 'ltr';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
